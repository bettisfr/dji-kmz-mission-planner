<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Planner</title>
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
</head>
<body>
    <!-- Map Section -->
    <div id="map">
        <!-- The map will be rendered here -->
    </div>

    <!-- Sidebar Section -->
    <div id="sidebar">
        <h2>Mission</h2>

        <!-- Waypoints List -->
        <div id="globalParameters">
            <strong>Parameters</strong>
            <p>No parameters added yet.</p>
        </div>

        <!-- Waypoints List -->
        <div id="waypointsList">
            <strong>Waypoints</strong>
            <p>No waypoints added yet.</p>
        </div>
    </div>

    <div id="popup" title="Available Actions">
        <form id="actionForm">
            <div class="form-group">
                <label for="actionSelect">Select Action:</label>
                <select id="actionSelect" onchange="updateParameters()">
                    <!-- Options will be populated dynamically -->
                </select>
            </div>
            <div class="form-group" id="parametersContainer">
                <!-- Parameters will be populated dynamically -->
            </div>
        </form>
    </div>

    <script src="../static/config.js"></script>
    <script src="../static/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
</body>
</html>
